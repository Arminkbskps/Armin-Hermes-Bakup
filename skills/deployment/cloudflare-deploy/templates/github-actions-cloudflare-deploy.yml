name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.AMNGRAM_SITE_URL || 'https://amngram.pages.dev' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'amngram' }}
      API_BASE_OVERRIDE: ${{ vars.AMNGRAM_API_BASE }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create D1 Database
        id: d1
        run: |
          OUTPUT=$(wrangler d1 create amngram-db 2>&1) || true
          echo "$OUTPUT"
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id = "\K[^"]+')
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Schema to D1
        run: |
          DB_ID="${{ steps.d1.outputs.db_id }}"
          if [ -z "$DB_ID" ]; then
            echo "D1 already exists, using secret"
            DB_ID="${{ secrets.CLOUDFLARE_D1_ID }}"
          fi
          wrangler d1 execute "$DB_ID" --remote --yes --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # OPTIONAL: Create R2 Bucket (requires payment method)
      # Comment out if using Supabase Storage instead
      - name: Create R2 Bucket
        run: wrangler r2 bucket create amngram-media 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ALTERNATIVE: Supabase Storage Setup (no payment method required)
      # Uncomment and use instead of R2 steps above
      # - name: Setup Supabase Storage
      #   run: |
      #     # Requires SUPABASE_URL and SUPABASE_ANON_KEY secrets
      #     # Create bucket 'amngram-media' manually in Supabase Dashboard (Storage > Create bucket)
      #     echo "Supabase Storage configured via env vars"
      #   env:
      #     SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      #     SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Generate wrangler.toml
        run: |
          DB_ID="${{ steps.d1.outputs.db_id }}"
          if [ -z "$DB_ID" ]; then
            DB_ID="${{ secrets.CLOUDFLARE_D1_ID }}"
          fi
          cat > wrangler.toml << TOML
          name = "amngram-api"
          main = "backend/worker.js"
          compatibility_date = "2024-07-01"
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          [vars]
          JWT_SECRET = "${{ secrets.JWT_SECRET }}"
          SITE_URL = "https://amngram.pages.dev"
          SUPABASE_URL = "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co"
          SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"

          [[d1_databases]]
          binding = "DB"
          database_name = "amngram-db"
          database_id = "$DB_ID"

          # Use EITHER R2 (requires payment) OR Supabase (no payment)
          # For Supabase: remove [[r2_buckets]] and add SUPABASE_URL/SUPABASE_ANON_KEY above
          # For R2: uncomment below and comment out Supabase vars
          # [[r2_buckets]]
          # binding = "MEDIA"
          # bucket_name = "amngram-media"
          TOML

      - name: Deploy Worker
        run: wrangler deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=amngram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
