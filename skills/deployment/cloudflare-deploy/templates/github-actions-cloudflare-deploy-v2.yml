name: Deploy AmnGram

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: amngram-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.AMNGRAM_SITE_URL || 'https://amngram.pages.dev' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'amngram' }}
      API_BASE_OVERRIDE: ${{ vars.AMNGRAM_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${CLOUDFLARE_D1_ID:?Missing CLOUDFLARE_D1_ID secret}"
          : "${JWT_SECRET:?Missing JWT_SECRET secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET must be at least 32 characters" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Prepare CI configuration
              id: config
              shell: bash
              run: |
                set -euo pipefail
                CONFIG="$GITHUB_WORKSPACE/wrangler.ci.toml"
                SECRETS="$GITHUB_WORKSPACE/amngram-secrets.json"
                OUTPUT="$GITHUB_WORKSPACE/wrangler-output.ndjson"
                python3 - <<'PY'
                import json, os
                from pathlib import Path

                source = Path('wrangler.toml').read_text(encoding='utf-8')
                source = source.replace('__D1_ID__', os.environ['CLOUDFLARE_D1_ID'])
                source = source.replace('__SITE_URL__', os.environ['SITE_URL'].replace('"', '\\"'))
                source = source.replace('__SUPABASE_ANON_KEY__', os.environ.get('SUPABASE_ANON_KEY', ''))
                Path(os.environ['GITHUB_WORKSPACE'], 'wrangler.ci.toml').write_text(source, encoding='utf-8')
                Path(os.environ['GITHUB_WORKSPACE'], 'amngram-secrets.json').write_text(
                    json.dumps({
                        'JWT_SECRET': os.environ['JWT_SECRET'],
                        'SUPABASE_ANON_KEY': os.environ.get('SUPABASE_ANON_KEY', '')
                    }),
                    encoding='utf-8',
                )
                PY
                echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
                echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"
                echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Apply D1 schema
        run: npx wrangler d1 execute amngram-db --remote --yes --file=./schema.sql --config "${{ steps.config.outputs.config }}"

      - name: Deploy Worker
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ steps.config.outputs.output }}
        run: npx wrangler deploy --config "${{ steps.config.outputs.config }}" --secrets-file "${{ steps.config.outputs.secrets }}"

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets
          cp index.html _headers dist/
          cp -R assets/css assets/js dist/assets/
          node <<'NODE'
          const fs = require('node:fs');
          const outputPath = process.env.WRANGLER_OUTPUT;
          const override = (process.env.API_BASE_OVERRIDE || '').replace(/\/$/, '');
          const lines = fs.readFileSync(outputPath, 'utf8').trim().split(/\r?\n/).filter(Boolean);
          const events = lines.map((line) => JSON.parse(line));
          const deploy = [...events].reverse().find((event) => event.type === 'deploy');
          const detected = deploy?.targets?.find((target) => /^https:\/\//.test(target));
          const apiBase = override || detected;
          if (!apiBase) throw new Error('Could not determine deployed Worker URL. Set AMNGRAM_API_BASE repository variable.');
          fs.writeFileSync('dist/runtime-config.json', JSON.stringify({ apiBase }, null, 2) + '\n');
          console.log(`Frontend API base: ${apiBase}`);
          NODE
        env:
          WRANGLER_OUTPUT: ${{ steps.config.outputs.output }}

      - name: Deploy Pages
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT"