<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="220" style="background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0;">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
        </marker>
      </defs>
      
      <!-- Rays Ox and Oy -->
      <line x1="40" y1="200" x2="337" y2="200" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
      <line x1="40" y1="200" x2="219.41419168204274" y2="87.8895703203061" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
      
      <!-- Vertical segments BA and DC (perpendicular to Ox) -->
      <line x1="124" y1="147.5109744396165" x2="124" y2="200" stroke="#0284c7" stroke-width="2.2" />
      <line x1="185.4922678357857" y1="109.0863408896343" x2="185.4922678357857" y2="200" stroke="#0284c7" stroke-width="2.2" />
      
      <!-- Perpendicular symbols -->
      <path d="M 124 186 L 138 186 L 138 200" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 185.4922678357857 186 L 199.4922678357857 186 L 199.4922678357857 200" fill="none" stroke="#0284c7" stroke-width="1.5" />
      
      <!-- Zigzag lines: BC and DE (parallel) -->
      <line x1="124" y1="147.5109744396165" x2="185.4922678357857" y2="200" stroke="#e11d48" stroke-width="2.2" />
      <line x1="185.4922678357857" y1="109.0863408896343" x2="292" y2="200" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="6,4" />
      
      <!-- Parallel indicator arrows on BC and DE -->
      <polygon points="151.74613391789285,179.75548721980823 159.74613391789285,173.75548721980823 151.74613391789285,167.75548721980823" fill="#e11d48" />
      <polygon points="235.74613391789285,160.54317044481715 243.74613391789285,154.54317044481715 235.74613391789285,148.54317044481715" fill="#e11d48" />
      
      <!-- Points -->
      <circle cx="40" cy="200" r="4" fill="#0f172a" />
      <circle cx="124" cy="200" r="4" fill="#0284c7" />
      <circle cx="185.4922678357857" cy="200" r="4" fill="#0284c7" />
      <circle cx="292" cy="200" r="4" fill="#0f172a" />
      <circle cx="124" cy="147.5109744396165" r="4" fill="#e11d48" />
      <circle cx="185.4922678357857" cy="109.0863408896343" r="4" fill="#e11d48" />
      
      <!-- Labels -->
      <text x="22" y="206" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="14" fill="#0f172a">O</text>
      <text x="345" y="205" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="14" fill="#475569">x</text>
      <text x="227.41419168204274" y="85.8895703203061" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="14" fill="#475569">y</text>
      
      <text x="120" y="220" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="13" fill="#0284c7">A</text>
      <text x="181.4922678357857" y="220" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="13" fill="#0284c7">C</text>
      <text x="288" y="220" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="13" fill="#0f172a">E</text>
      
      <text x="119" y="137.5109744396165" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="13" fill="#e11d48">B</text>
      <text x="180.4922678357857" y="99.0863408896343" font-family="Vazirmatn, sans-serif" font-weight="bold" font-size="13" fill="#e11d48">D</text>
      
      <!-- Dimensions bracket/text -->
      <text x="77.0" y="238" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">OA = ۳</text>
      <text x="161.0" y="190" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">OE = ۹</text>
      <text x="149.74613391789285" y="190" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="bold" fill="#e11d48">OC = ؟</text>
      
      <!-- Legend box -->
      <rect x="235" y="15" width="130" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="245" y="32" font-family="Vazirmatn, sans-serif" font-size="10.5" fill="#0369a1">BA ⊥ Ox , DC ⊥ Ox</text>
      <text x="245" y="48" font-family="Vazirmatn, sans-serif" font-size="10.5" fill="#e11d48">BC ∥ DE (قضیه تالس)</text>
      <text x="245" y="64" font-family="Vazirmatn, sans-serif" font-size="10.5" font-weight="bold" fill="#166534">OC² = OA · OE</text>
    </svg>