<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Vazirmatn', sans-serif;
    padding: 30px;
    direction: rtl;
  }
  .math {
    font-family: 'Cambria Math', 'Times New Roman', serif;
    direction: ltr;
    display: inline-flex;
    align-items: center;
    font-size: 1.05rem;
    color: #1e293b;
    font-weight: bold;
    margin: 0 4px;
  }
  .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    padding: 0 3px;
    font-size: 0.88em;
    line-height: 1.15;
    margin: 0 2px;
  }
  .num {
    border-bottom: 1.5px solid #1e293b;
    padding: 0 2px 2px 2px;
  }
  .den {
    padding: 2px 2px 0 2px;
  }
  .sqrt {
    display: inline-flex;
    align-items: center;
  }
  .sqrt-symbol {
    font-size: 1.25em;
    margin-right: 1px;
  }
  .sqrt-content {
    border-top: 1.5px solid #1e293b;
    padding: 0 2px;
  }
</style>
</head>
<body>
  <h2>تست رندر ریاضی تمیز بدون لاتک خام:</h2>
  <p>
    اگر <span class="math">sin &alpha; = - <span class="frac"><span class="num">5</span><span class="den">13</span></span></span> باشد، حاصل <span class="math">cos &alpha; = - <span class="frac"><span class="num">12</span><span class="den">13</span></span></span> و همچنین <span class="math"><span class="sqrt"><span class="sqrt-symbol">&radic;</span><span class="sqrt-content">25 - cot<sup>2</sup>&alpha;</span></span> = 1</span> به دست می‌آید.
  </p>
</body>
</html>
